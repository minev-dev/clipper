[project]
name = "clipper"
version = "0.0.1"
requires-python = "~=3.14.0"
dependencies = [
    "typer>=0.23.2,<0.24",
    "google-api-python-client>=2.194.0,<3",
    "google-auth-oauthlib>=1.3.1,<2",
    "google-auth-httplib2>=0.3.1,<0.4",
    "pydantic>=2.12.5,<3",
    "ruff>=0.15.10",
    "google-genai>=1.72.0",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ty>=0.0.29",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
extend-select = ["I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
